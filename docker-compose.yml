x-bake: &x-bake
  platforms:
    - linux/amd64
    - linux/arm64/v8

services:
  ##
  ## PHP8
  ##
  php8:
    image: oliverlundquist/php85:${PHP8_TAG}
    build:
      dockerfile: build/php/php8/php8
      args:
        PHP8_VERSION: ${PHP8_VERSION}
      x-bake: *x-bake
  php8-opcache:
    image: oliverlundquist/php85-opcache:${PHP8_TAG}
    build:
      dockerfile: build/php/php8/php8-opcache
      args:
        PHP8_TAG: ${PHP8_TAG}
      x-bake: *x-bake
  php8-queue-worker:
    image: oliverlundquist/php85-queue-worker:${PHP8_TAG}
    build:
      dockerfile: build/php/php8/php8-queue-worker
      args:
        PHP8_TAG: ${PHP8_TAG}
      x-bake: *x-bake
  php8-xdebug:
    image: oliverlundquist/php85-xdebug:${PHP8_TAG}
    build:
      dockerfile: build/php/php8/php8-xdebug
      args:
        PHP8_TAG: ${PHP8_TAG}
      x-bake: *x-bake

  ##
  ## Other
  ##
  aws-cli:
    image: oliverlundquist/aws-cli:${AWS_CLI_TAG}
    build:
      dockerfile: build/aws-cli
      x-bake: *x-bake
  logstash:
    image: oliverlundquist/logstash:${LOGSTASH_TAG}
    build:
      dockerfile: build/logstash
      args:
        LOGSTASH_TAG: ${LOGSTASH_TAG}
      x-bake: *x-bake
  nginx:
    image: oliverlundquist/nginx:${NGINX_TAG}
    build:
      dockerfile: build/nginx
      args:
        NGINX_TAG: ${NGINX_TAG}
      x-bake: *x-bake
  pusher-local-dev-server:
    image: oliverlundquist/pusher-local-dev-server:${PUSHER_TAG}
    build:
      dockerfile: build/pusher-local-dev-server
      x-bake: *x-bake
