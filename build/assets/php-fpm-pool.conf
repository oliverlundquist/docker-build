; Overrides the default www pool settings from the official php image (max_children = 5)
; Sized for 8 GiB instances with the php container limited to 2048 MB in AWS EB Dockerrun.aws.json
; 12 workers leave room for 2 concurrent 768 MB requests (mystore-laravel CSV/report controllers) + 10 regular workers
; File name must sort after zz-docker.conf so these values take precedence
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; recycle workers after 500 requests so slow memory leaks can't accumulate
pm.max_requests = 500
