server {
    listen       80;
    server_name  localhost;

    # Hidden files and directories (.env, .git, .ssh, ...) are never served, except .well-known
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # PHP scripts other than /index.php (phpinfo.php, i.php, pi.php7, ...) are never served or executed
    location ~* \.(?:php\d*|phtml|phar)$ {
        return 404;
    }

    # Requests that look like a file (.bak, .sql, .log.save, .swp, .rar, ...) are served only if the
    # file exists in public/, otherwise answered with a 404 here instead of being passed to php-fpm
    location ~ \.[^/]*$ {
        root /var/app/current/public;
        try_files $uri =404;
    }

    location / {
        root /var/app/current/public;
        try_files $uri /index.php?$query_string;

        location = /index.php {
            fastcgi_pass FASTCGI_PASS_HOST:FASTCGI_PASS_PORT;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 300;
        }
    }
}
